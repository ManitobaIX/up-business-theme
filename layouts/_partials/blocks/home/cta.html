<section class="py-16">
  <div class="container mx-auto px-4">
    {{ with .title }}
      <h1 class="text-primary mb-8 text-center text-6xl font-bold">{{ . }}</h1>
    {{ end }}
    {{ with .button }}
      <div class="flex items-center justify-center">
        <a
          class="bg-primary hover:bg-primary/90 flex items-center gap-3 rounded px-12 py-4 text-lg text-white duration-500"
          href="{{ .link }}"
        >
          {{ .label }}
          {{ partial "icons/arrow-right" }}
        </a>
      </div>
    {{ end }}
  </div>
</section>
